<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dana Petersen</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --text-primary: #1a1a1a;
      --text-secondary: #6b6b6b;
      --text-tertiary: #aaaaaa;
      --border: #e5e5e5;
      --bg: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text-primary: #f0f0f0;
        --text-secondary: #999999;
        --text-tertiary: #666666;
        --border: #2a2a2a;
        --bg: #111111;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .page {
      max-width: 520px;
      width: 100%;
    }

    .name {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }

    .tagline {
      font-size: 15px;
      color: var(--text-secondary);
      margin-top: 8px;
      line-height: 1.6;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    .section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-tertiary);
      margin-bottom: 0;
    }

    .links {
      display: flex;
      flex-direction: column;
    }

    a.link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--text-primary);
    }

    a.link-row:first-of-type {
      border-top: 1px solid var(--border);
      margin-top: 1rem;
    }

    .link-left {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .link-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .link-desc {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .link-arrow {
      font-size: 13px;
      color: var(--text-tertiary);
    }

    a.link-row:hover .link-name {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .footer {
      margin-top: 2.5rem;
      font-size: 12px;
      color: var(--text-tertiary);
    }
  </style>
</head>
<body>
  <div class="page">
    <p class="name">Dana Petersen</p>
    <p class="tagline">Software engineer and windsurfer,<br>based in Corpus Christi, TX.</p>

    <hr>

    <p class="section-label">Links</p>

    <div class="links">
      <a href="https://github.com/danapetersen" class="link-row" target="_blank" rel="noopener">
        <div class="link-left">
          <span class="link-name">GitHub</span>
          <span class="link-desc">Projects &amp; code</span>
        </div>
        <span class="link-arrow">↗</span>
      </a>
      <a href="https://www.linkedin.com/in/danapetersen/" class="link-row" target="_blank" rel="noopener">
        <div class="link-left">
          <span class="link-name">LinkedIn</span>
          <span class="link-desc">Professional profile</span>
        </div>
        <span class="link-arrow">↗</span>
      </a>
      <a href="mailto:dana@petersen.one" class="link-row">
        <div class="link-left">
          <span class="link-name">Email</span>
          <span class="link-desc">dana@petersen.one</span>
        </div>
        <span class="link-arrow">↗</span>
      </a>
    </div>

    <p class="footer">petersen.one</p>
  </div>
</body>
</html>
