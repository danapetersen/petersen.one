<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dana Petersen</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0c0c0c;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .page {
      max-width: 520px;
      width: 100%;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 1.5rem;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 1px solid #2a2a2a;
      flex-shrink: 0;
      background: #1a1a1a;
    }

    .name {
      font-size: 28px;
      font-weight: 500;
      color: #f0f0f0;
      letter-spacing: -0.5px;
      line-height: 1.15;
    }

    .tagline {
      font-size: 13px;
      color: #555;
      margin-top: 6px;
      line-height: 1.6;
    }

    hr {
      border: none;
      border-top: 1px solid #1e1e1e;
      margin: 2rem 0;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    a.link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: #141414;
      border: 1px solid #1e1e1e;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }

    a.link-row:hover {
      background: #1a1a1a;
      border-color: #2a2a2a;
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .link-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .link-icon svg {
      width: 15px;
      height: 15px;
      fill: #888;
    }

    .link-name {
      font-size: 14px;
      font-weight: 500;
      color: #e0e0e0;
    }

    .link-desc {
      font-size: 12px;
      color: #555;
      margin-top: 1px;
    }

    .link-arrow {
      font-size: 13px;
      color: #333;
    }

    a.link-row:hover .link-arrow {
      color: #555;
    }

    .footer {
      margin-top: 2.5rem;
      font-size: 11px;
      color: #333;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">

        alt="Dana Petersen">
      <div>
        <h1 class="name">Dana Petersen</h1>
